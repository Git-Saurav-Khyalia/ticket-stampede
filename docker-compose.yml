services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stampede
      POSTGRES_PASSWORD: stampede
      POSTGRES_DB: stampede
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stampede -d stampede"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - stampede_pgdata:/var/lib/postgresql/data

  seller:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://stampede:stampede@db:5432/stampede
    depends_on:
      db:
        condition: service_healthy

volumes:
  stampede_pgdata:
