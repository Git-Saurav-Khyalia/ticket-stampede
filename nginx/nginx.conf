# Load balancer for the Ticket Stampede seller. Round-robin across all
# three seller instances (nginx's default upstream method -- no method
# directive needed, and no sticky-session/ip_hash directive is used,
# deliberately: the seller is stateless at the process level, and
# PostgreSQL (via SELECT ... FOR UPDATE and the (sale_id, request_id)
# UNIQUE constraint) is the sole source of truth for allocation and
# idempotency, so any instance can safely serve any request -- including
# a retry of a request_id that a *different* instance originally handled.
upstream ticket_stampede_sellers {
    server seller-1:8000;
    server seller-2:8000;
    server seller-3:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://ticket_stampede_sellers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
